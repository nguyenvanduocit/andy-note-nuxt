name: Release

# Release pipeline:
#   1. Push to main → release-please opens / updates a Release PR that bumps
#      package.json + .release-please-manifest.json and writes CHANGELOG.md.
#   2. You manually merge the Release PR when ready. That merge re-triggers
#      this workflow because it's a user-identity push (not GITHUB_TOKEN).
#   3. On the next run, release-please sees the merged release PR → creates
#      the GitHub Release + tag → the publish job runs npm publish via OIDC
#      trusted publisher (no NPM_TOKEN needed).
#
# The workflow file path MUST stay `release.yml` — npm Trusted Publisher
# is configured against that exact filename for nguyenvanduocit/andy-note-nuxt.
on:
  push:
    branches:
      - main

permissions:
  contents: write        # release-please creates commits, tags, releases
  pull-requests: write   # release-please opens / updates the Release PR
  id-token: write        # npm OIDC trusted publishing

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1; Node 20 ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx vue-tsc --noEmit

      # npm authenticates via the GitHub OIDC token (id-token: write) using
      # the Trusted Publisher configured on npmjs.com. No NODE_AUTH_TOKEN.
      - name: Publish to npm
        run: npm publish --access public --provenance
